<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="920" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Advanced RAG - System Architecture</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#64748b">Fully local | Question-bank-first | Guardrailed by curated Q/A pairs</text>

  <!-- Interfaces -->
  <g filter="url(#shadow)">
    <rect x="40" y="95" width="170" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Streamlit UI</text>
    <text x="125" y="147" text-anchor="middle" font-size="12" fill="#1d4ed8">app.py</text>

    <rect x="240" y="95" width="170" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="325" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">HTTP API</text>
    <text x="325" y="147" text-anchor="middle" font-size="12" fill="#1d4ed8">rag/api.py</text>

    <rect x="440" y="95" width="170" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="525" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">CLI</text>
    <text x="525" y="147" text-anchor="middle" font-size="12" fill="#1d4ed8">rag/pipeline.py</text>
  </g>

  <!-- Orchestrator -->
  <g filter="url(#shadow)">
    <rect x="700" y="95" width="460" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="930" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">RAG Pipeline (orchestrator)</text>
    <text x="930" y="147" text-anchor="middle" font-size="12" fill="#6d28d9">ingest | ask | stats | manual Q/A upsert</text>
  </g>

  <line x1="210" y1="130" x2="700" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="130" x2="700" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="130" x2="700" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ingest lane -->
  <text x="40" y="205" font-size="18" font-weight="700" fill="#0f172a">Ingest path (build once)</text>
  <rect x="40" y="215" width="1120" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="150" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="145" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">PDF upload</text>
    <text x="145" y="298" text-anchor="middle" font-size="11" fill="#b45309">data/uploads</text>

    <rect x="250" y="240" width="170" height="84" rx="10" fill="#ffedd5" stroke="#ea580c"/>
    <text x="335" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">PDF loader</text>
    <text x="335" y="288" text-anchor="middle" font-size="11" fill="#c2410c">rag/pdf_loader.py</text>
    <text x="335" y="306" text-anchor="middle" font-size="10" fill="#9a3412">text layer + tables</text>

    <rect x="450" y="240" width="150" height="84" rx="10" fill="#ffedd5" stroke="#ea580c"/>
    <text x="525" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">OCR (Surya)</text>
    <text x="525" y="288" text-anchor="middle" font-size="11" fill="#c2410c">rag/ocr.py</text>
    <text x="525" y="306" text-anchor="middle" font-size="10" fill="#9a3412">RTL / scanned pages</text>

    <rect x="630" y="250" width="150" height="64" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="705" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Chunker</text>
    <text x="705" y="298" text-anchor="middle" font-size="11" fill="#15803d">rag/chunker.py</text>

    <rect x="810" y="240" width="170" height="84" rx="10" fill="#fce7f3" stroke="#db2777"/>
    <text x="895" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">QA extractor</text>
    <text x="895" y="288" text-anchor="middle" font-size="11" fill="#be185d">rag/qa_extractor.py</text>
    <text x="895" y="306" text-anchor="middle" font-size="10" fill="#9d174d">evidence validation</text>

    <rect x="1010" y="250" width="130" height="64" rx="10" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="1075" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Embed</text>
    <text x="1075" y="298" text-anchor="middle" font-size="11" fill="#4338ca">bge-m3</text>
  </g>

  <line x1="220" y1="282" x2="250" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="282" x2="450" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="282" x2="630" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="282" x2="810" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="282" x2="1010" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage -->
  <g filter="url(#shadow)">
    <rect x="250" y="360" width="700" height="130" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="600" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Vector store + indexes</text>
    <text x="600" y="410" text-anchor="middle" font-size="12" fill="#475569">rag/vectorstore.py | Chroma (data/chroma)</text>

    <rect x="280" y="430" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="375" y="457" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Question bank collection</text>

    <rect x="505" y="430" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="600" y="457" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Document chunks collection</text>

    <rect x="730" y="430" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="825" y="457" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">BM25 (dense + lexical)</text>
  </g>

  <!-- Guardrails -->
  <g filter="url(#shadow)">
    <rect x="70" y="360" width="150" height="130" rx="12" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="145" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#3f6212">Guardrails</text>
    <text x="145" y="414" text-anchor="middle" font-size="11" fill="#4d7c0f">Edit / add Q/A</text>
    <text x="145" y="432" text-anchor="middle" font-size="11" fill="#4d7c0f">in Streamlit UI</text>
    <text x="145" y="458" text-anchor="middle" font-size="10" fill="#365314">curated pairs steer</text>
    <text x="145" y="474" text-anchor="middle" font-size="10" fill="#365314">Tier 1 retrieval</text>
  </g>
  <line x1="145" y1="165" x2="145" y2="360" stroke="#65a30d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="220" y1="425" x2="250" y2="425" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="895" y1="324" x2="895" y2="340" stroke="#475569" stroke-width="2"/>
  <line x1="705" y1="314" x2="705" y2="340" stroke="#475569" stroke-width="2"/>
  <line x1="705" y1="340" x2="895" y2="340" stroke="#475569" stroke-width="2"/>
  <line x1="800" y1="340" x2="800" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Query lane -->
  <text x="40" y="555" font-size="18" font-weight="700" fill="#0f172a">Query path (answer many times)</text>
  <rect x="40" y="565" width="1120" height="320" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="70" y="600" width="130" height="58" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="135" y="628" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">User query</text>
    <text x="135" y="646" text-anchor="middle" font-size="11" fill="#1d4ed8">natural language</text>

    <rect x="230" y="590" width="180" height="78" rx="10" fill="#cffafe" stroke="#0891b2"/>
    <text x="320" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">Retrieval router</text>
    <text x="320" y="638" text-anchor="middle" font-size="11" fill="#0e7490">rag/retrieval.py</text>
    <text x="320" y="656" text-anchor="middle" font-size="10" fill="#155e75">decompose | rerank | gate</text>

    <rect x="440" y="600" width="150" height="58" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="515" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Tier 1</text>
    <text x="515" y="642" text-anchor="middle" font-size="11" fill="#15803d">question bank &gt;= 0.72</text>

    <rect x="620" y="600" width="150" height="58" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="695" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">Tier 2</text>
    <text x="695" y="642" text-anchor="middle" font-size="11" fill="#a16207">chunk RAG &gt;= 0.45</text>

    <rect x="800" y="600" width="150" height="58" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="875" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Tier 3</text>
    <text x="875" y="642" text-anchor="middle" font-size="11" fill="#b91c1c">refuse (no LLM)</text>

    <rect x="980" y="590" width="160" height="78" rx="10" fill="#fce7f3" stroke="#db2777"/>
    <text x="1060" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">Answerer</text>
    <text x="1060" y="638" text-anchor="middle" font-size="11" fill="#be185d">rag/answerer.py</text>
    <text x="1060" y="656" text-anchor="middle" font-size="10" fill="#9d174d">citations | groundedness</text>
  </g>

  <line x1="200" y1="629" x2="230" y2="629" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="629" x2="440" y2="629" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="629" x2="620" y2="629" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="629" x2="800" y2="629" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="629" x2="980" y2="629" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Guards -->
  <g filter="url(#shadow)">
    <rect x="230" y="710" width="910" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="685" y="738" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Four hallucination guards</text>
    <text x="300" y="770" font-size="12" fill="#7c2d12">1. Evidence at extraction</text>
    <text x="300" y="792" font-size="12" fill="#7c2d12">2. Similarity thresholds</text>
    <text x="300" y="814" font-size="12" fill="#7c2d12">3. INSUFFICIENT_CONTEXT sentinel</text>
    <text x="300" y="836" font-size="12" fill="#7c2d12">4. Post-hoc groundedness audit</text>
    <text x="760" y="770" font-size="12" fill="#7c2d12">Manual Q/A guardrails -&gt; Tier 1</text>
    <text x="760" y="792" font-size="12" fill="#7c2d12">OCR + extract caches -&gt; faster re-ingest</text>
    <text x="760" y="814" font-size="12" fill="#7c2d12">eval/ -&gt; route-only + baseline checks</text>
    <text x="760" y="836" font-size="12" fill="#7c2d12">rag/metrics.py -&gt; latency and refuse rate</text>
  </g>

  <!-- Ollama -->
  <g filter="url(#shadow)">
    <rect x="70" y="710" width="130" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="135" y="742" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Ollama</text>
    <text x="135" y="764" text-anchor="middle" font-size="11" fill="#6d28d9">rag/ollama_client.py</text>
    <text x="135" y="790" text-anchor="middle" font-size="10" fill="#5b21b6">gemma4:31b</text>
    <text x="135" y="808" text-anchor="middle" font-size="10" fill="#5b21b6">extract + answer</text>
    <text x="135" y="834" text-anchor="middle" font-size="10" fill="#5b21b6">bge-m3 embed</text>
  </g>

  <line x1="600" y1="425" x2="600" y2="565" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <line x1="135" y1="165" x2="135" y2="710" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="895" y1="324" x2="170" y2="710" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1060" y1="668" x2="170" y2="780" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="600" y="900" text-anchor="middle" font-size="12" fill="#64748b">config.py | rag/schemas.py | rag/text_normalize.py | data/cache (OCR + extract)</text>
</svg>
