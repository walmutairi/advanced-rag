<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="1120" fill="#f8fafc"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#15803d"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Advanced RAG - System Architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748b">Fully local  |  Question-bank-first  |  Guardrailed by curated Q/A pairs</text>

  <!-- ========== ENTRY POINTS ========== -->
  <rect x="24" y="86" width="1152" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="112" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.6">ENTRY POINTS</text>

  <rect x="44" y="126" width="168" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="128" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Streamlit UI</text>
  <text x="128" y="168" text-anchor="middle" font-size="11" fill="#1d4ed8">app.py</text>

  <rect x="228" y="126" width="168" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="312" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">HTTP API</text>
  <text x="312" y="168" text-anchor="middle" font-size="11" fill="#1d4ed8">rag/api.py</text>

  <rect x="412" y="126" width="168" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="496" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">CLI</text>
  <text x="496" y="168" text-anchor="middle" font-size="11" fill="#1d4ed8">rag/pipeline.py</text>

  <line x1="580" y1="155" x2="668" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="676" y="122" width="476" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="914" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">RAG Pipeline (orchestrator)</text>
  <text x="914" y="170" text-anchor="middle" font-size="12" fill="#6d28d9">ingest  |  ask  |  stats  |  manual Q/A upsert</text>

  <!-- ========== INGEST ========== -->
  <rect x="24" y="220" width="1152" height="248" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="44" y="246" font-size="13" font-weight="700" fill="#92400e" letter-spacing="0.6">INGEST PATH  -  BUILD ONCE</text>
  <text x="1156" y="246" text-anchor="end" font-size="12" fill="#b45309">PDF to question bank + chunk index</text>

  <!-- step cards -->
  <g>
    <rect x="44" y="266" width="152" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
    <circle cx="64" cy="286" r="11" fill="#d97706"/>
    <text x="64" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="120" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">PDF upload</text>
    <text x="120" y="326" text-anchor="middle" font-size="11" fill="#b45309">data/uploads</text>
  </g>
  <line x1="196" y1="310" x2="214" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="220" y="266" width="152" height="88" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <circle cx="240" cy="286" r="11" fill="#ea580c"/>
    <text x="240" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="296" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">PDF loader</text>
    <text x="296" y="322" text-anchor="middle" font-size="11" fill="#c2410c">pdf_loader.py</text>
    <text x="296" y="338" text-anchor="middle" font-size="10" fill="#9a3412">text, tables, captions</text>
  </g>
  <line x1="372" y1="310" x2="390" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="396" y="266" width="152" height="88" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <circle cx="416" cy="286" r="11" fill="#ea580c"/>
    <text x="416" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="472" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">OCR (Surya)</text>
    <text x="472" y="322" text-anchor="middle" font-size="11" fill="#c2410c">ocr.py</text>
    <text x="472" y="338" text-anchor="middle" font-size="10" fill="#9a3412">scanned / RTL pages</text>
  </g>
  <line x1="548" y1="310" x2="566" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="572" y="266" width="152" height="88" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <circle cx="592" cy="286" r="11" fill="#16a34a"/>
    <text x="592" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <text x="648" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Chunker</text>
    <text x="648" y="322" text-anchor="middle" font-size="11" fill="#15803d">chunker.py</text>
    <text x="648" y="338" text-anchor="middle" font-size="10" fill="#166534">parent-child windows</text>
  </g>
  <line x1="724" y1="310" x2="742" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="748" y="266" width="168" height="88" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.6"/>
    <circle cx="768" cy="286" r="11" fill="#db2777"/>
    <text x="768" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
    <text x="832" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">QA extractor</text>
    <text x="832" y="322" text-anchor="middle" font-size="11" fill="#be185d">qa_extractor.py</text>
    <text x="832" y="338" text-anchor="middle" font-size="10" fill="#9d174d">evidence must match</text>
  </g>
  <line x1="916" y1="310" x2="934" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <g>
    <rect x="940" y="266" width="212" height="88" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="1.6"/>
    <circle cx="960" cy="286" r="11" fill="#4338ca"/>
    <text x="960" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
    <text x="1046" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Embed + index</text>
    <text x="1046" y="322" text-anchor="middle" font-size="11" fill="#4338ca">bge-m3 + vectorstore.py</text>
    <text x="1046" y="338" text-anchor="middle" font-size="10" fill="#312e81">Chroma + BM25</text>
  </g>

  <!-- Guardrails under ingest -->
  <rect x="44" y="372" width="532" height="76" rx="10" fill="#ecfccb" stroke="#65a30d" stroke-width="1.6"/>
  <text x="64" y="398" font-size="13" font-weight="700" fill="#3f6212">Guardrails: edit or add questions in the UI</text>
  <text x="64" y="420" font-size="12" fill="#4d7c0f">Curated Q/A pairs join the question bank immediately - no re-ingest.</text>
  <text x="64" y="438" font-size="12" fill="#4d7c0f">They steer Tier 1 toward approved answers and evidence.</text>

  <rect x="596" y="372" width="556" height="76" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="616" y="398" font-size="13" font-weight="700" fill="#334155">Caches (faster re-ingest)</text>
  <text x="616" y="420" font-size="12" fill="#475569">OCR cache: data/cache/ocr    Extract cache: data/cache/extract</text>
  <text x="616" y="438" font-size="12" fill="#475569">Unchanged pages and chunks skip the slow model calls.</text>

  <!-- ========== STORAGE ========== -->
  <rect x="24" y="484" width="1152" height="118" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="44" y="510" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.6">STORAGE  -  rag/vectorstore.py</text>
  <text x="1156" y="510" text-anchor="end" font-size="12" fill="#64748b">Chroma at data/chroma</text>

  <rect x="44" y="526" width="352" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="220" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Question bank collection</text>
  <text x="220" y="568" text-anchor="middle" font-size="11" fill="#15803d">questions + paraphrases + evidence</text>

  <rect x="424" y="526" width="352" height="56" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="600" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">Document chunks collection</text>
  <text x="600" y="568" text-anchor="middle" font-size="11" fill="#a16207">page-attributed passages</text>

  <rect x="804" y="526" width="348" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="978" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">BM25 lexical index</text>
  <text x="978" y="568" text-anchor="middle" font-size="11" fill="#475569">hybrid dense + keyword search</text>

  <!-- ========== QUERY ========== -->
  <rect x="24" y="618" width="1152" height="332" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="44" y="644" font-size="13" font-weight="700" fill="#1e3a8a" letter-spacing="0.6">QUERY PATH  -  ANSWER MANY TIMES</text>
  <text x="1156" y="644" text-anchor="end" font-size="12" fill="#1d4ed8">Question bank first, then chunks, else refuse</text>

  <rect x="44" y="666" width="160" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="124" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">User query</text>
  <text x="124" y="714" text-anchor="middle" font-size="11" fill="#1d4ed8">natural language</text>

  <line x1="204" y1="701" x2="228" y2="701" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="234" y="666" width="196" height="70" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/>
  <text x="332" y="688" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">Retrieval router</text>
  <text x="332" y="706" text-anchor="middle" font-size="11" fill="#0e7490">rag/retrieval.py</text>
  <text x="332" y="722" text-anchor="middle" font-size="10" fill="#155e75">decompose, rerank, gate</text>

  <line x1="430" y1="701" x2="454" y2="701" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Tier 1 -->
  <rect x="460" y="660" width="210" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="565" y="686" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Tier 1  Question bank</text>
  <text x="565" y="706" text-anchor="middle" font-size="12" fill="#15803d">hybrid search  &gt;= 0.72</text>
  <text x="565" y="724" text-anchor="middle" font-size="11" fill="#166534">pre-grounded Q/A + evidence</text>

  <!-- hit to answerer -->
  <line x1="670" y1="692" x2="904" y2="692" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="786" y="684" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">HIT</text>

  <!-- Answerer -->
  <rect x="910" y="660" width="242" height="82" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
  <text x="1031" y="686" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">Answerer</text>
  <text x="1031" y="706" text-anchor="middle" font-size="12" fill="#be185d">rag/answerer.py</text>
  <text x="1031" y="724" text-anchor="middle" font-size="11" fill="#9d174d">citations + groundedness audit</text>

  <!-- miss down to T2 -->
  <line x1="565" y1="742" x2="565" y2="768" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="580" y="762" font-size="11" font-weight="700" fill="#b91c1c">MISS</text>

  <!-- Tier 2 -->
  <rect x="460" y="774" width="210" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="565" y="800" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">Tier 2  Chunk RAG</text>
  <text x="565" y="820" text-anchor="middle" font-size="12" fill="#a16207">RRF over chunks  &gt;= 0.45</text>

  <!-- hit T2 to answerer -->
  <path d="M670,809 H790 V701" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="700" y="800" font-size="11" font-weight="700" fill="#15803d">HIT</text>

  <!-- miss T2 to T3 -->
  <line x1="565" y1="844" x2="565" y2="868" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="580" y="862" font-size="11" font-weight="700" fill="#b91c1c">MISS</text>

  <!-- Tier 3 -->
  <rect x="460" y="874" width="210" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="565" y="898" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Tier 3  Refuse</text>
  <text x="565" y="916" text-anchor="middle" font-size="11" fill="#b91c1c">no LLM call  -  no hallucination</text>

  <!-- storage feeds router -->
  <line x1="220" y1="582" x2="332" y2="666" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="600" y1="582" x2="565" y2="660" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- ========== BOTTOM: OLLAMA + GUARDS ========== -->
  <rect x="24" y="966" width="368" height="132" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="44" y="992" font-size="13" font-weight="700" fill="#5b21b6" letter-spacing="0.6">LOCAL INFERENCE  -  OLLAMA</text>
  <text x="44" y="1016" font-size="12" fill="#6d28d9">rag/ollama_client.py</text>
  <text x="44" y="1038" font-size="12" fill="#5b21b6">Extract + answer: gemma4:31b</text>
  <text x="44" y="1056" font-size="12" fill="#5b21b6">Embeddings: bge-m3</text>
  <text x="44" y="1078" font-size="12" fill="#6d28d9">Nothing leaves the machine.</text>

  <rect x="408" y="966" width="768" height="132" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="428" y="992" font-size="13" font-weight="700" fill="#9a3412" letter-spacing="0.6">FOUR HALLUCINATION GUARDS</text>
  <text x="428" y="1018" font-size="12" fill="#7c2d12">1. Evidence at extraction  -  quotes must exist in the chunk</text>
  <text x="428" y="1038" font-size="12" fill="#7c2d12">2. Similarity thresholds  -  weak matches never reach the LLM</text>
  <text x="428" y="1058" font-size="12" fill="#7c2d12">3. INSUFFICIENT_CONTEXT sentinel  -  model must refuse when sources fall short</text>
  <text x="428" y="1078" font-size="12" fill="#7c2d12">4. Post-hoc groundedness audit  -  unsupported claims are discarded</text>
</svg>
